<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Avance de montaje</title>
<script src="https://components.connect.trimble.com/trimble-connect-workspace-api/index.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font:14px/1.4 "Segoe UI",system-ui,sans-serif;color:#1c2b3f;background:#fff}
header{background:#16345f;color:#fff;padding:12px 14px;border-bottom:3px solid #e8792b}
header h1{margin:0;font-size:18px}header small{opacity:.85;font-size:12px}
section{padding:12px 14px;border-bottom:1px solid #e3e7ec}
label{display:block;font-size:11px;letter-spacing:.04em;color:#5a6a7e;margin:8px 0 3px}
input,select{width:100%;padding:8px;border:1px solid #c6ced8;border-radius:4px;font:inherit;background:#fff}
.seg{display:flex;border:1px solid #16345f;border-radius:4px;overflow:hidden}
.seg button{flex:1;padding:7px 4px;border:0;background:#fff;color:#16345f;font:inherit;cursor:pointer}
.seg button.on{background:#16345f;color:#fff}
.row{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;padding:9px 6px;border-radius:4px;border:1px solid #16345f;background:#fff;color:#16345f;font:600 13px inherit;cursor:pointer}
.btn.pri{background:#16345f;color:#fff}.btn:disabled{opacity:.45;cursor:default}
.btn.g{background:#2e9e4f;border-color:#2e9e4f;color:#fff}.btn.o{background:#f28c28;border-color:#f28c28;color:#fff}
h2{margin:0 0 6px;font-size:12px;letter-spacing:.04em}
table{width:100%;border-collapse:collapse}th{font-size:12px;text-align:right;color:#5a6a7e;padding:3px 0}
td{padding:5px 0;text-align:right}th:first-child,td:first-child{text-align:left}
.dot{display:inline-block;width:14px;height:14px;border-radius:3px;margin-right:7px;vertical-align:-2px}
#sel{background:#f3f6fa;border-radius:4px;padding:8px;margin:6px 0;min-height:40px;word-break:break-word}
#msg{font-size:12px;color:#5a6a7e;margin-top:8px}.warn{color:#b3361b!important}
a.lnk{color:#16345f;font-size:12px;cursor:pointer;text-decoration:underline;margin-right:12px}
</style></head><body>
<header><h1>Avance de montaje</h1><small>NABLA Acero · seguimiento por ensamble · v0.3</small></header>
<section>
 <label>PROYECTO</label><input id="proy" readonly>
 <label>ORIGEN DEL AVANCE</label>
 <select id="orig"><option>Local de pruebas (navegador)</option><option disabled>Trimble Connect · 5.5_DB_REGISTROS (Fase 2)</option></select>
 <label>PIEZAS A MOSTRAR</label>
 <div class="seg" id="modo"><button data-m="all" class="on">Todas</button><button data-m="con">Con estado</button><button data-m="sin">Sin estado</button></div>
 <div class="row"><button class="btn pri" id="bCol">Colorear avance</button><button class="btn" id="bQuit">Quitar colores</button></div>
 <div id="msg">Carga el modelo y presiona «Colorear avance».</div>
</section>
<section>
 <h2>ESTADO REGISTRADO</h2>
 <table><tr><th>Etapa</th><th>Ens.</th><th>Ton</th></tr><tbody id="res"></tbody></table>
 <div style="font-size:12px;color:#5a6a7e;margin-top:6px">Todo lo que no tiene estado se muestra en gris.</div>
</section>
<section>
 <h2>ENSAMBLES SELECCIONADOS</h2>
 <div id="sel">Selecciona piezas en el modelo.</div>
 <div class="row"><button class="btn o" data-e="proceso">En proceso</button><button class="btn g" data-e="montado">Montado</button><button class="btn" data-e="none">Quitar estado</button></div>
 <div class="row"><button class="btn pri" id="bSave" disabled>Guardar</button></div>
 <div style="margin-top:10px"><a class="lnk" id="bExp">Exportar JSON</a><a class="lnk" id="bImp">Importar JSON</a><input type="file" id="fImp" accept=".json" hidden></div>
</section>
<section><h2>DIAGNÓSTICO</h2><button class="btn" id="bDiag">Ver datos de la selección</button>
<pre id="diag" style="white-space:pre-wrap;font-size:11px;max-height:280px;overflow:auto;margin:8px 0 0"></pre></section>
<script>
const $=id=>document.getElementById(id);
const RGB={montado:{r:46,g:158,b:79,a:255},proceso:{r:242,g:140,b:40,a:255},gris:{r:189,g:189,b:189,a:255}};
const HEX={montado:'#2e9e4f',proceso:'#f28c28'},NOM={montado:'Montado',proceso:'En proceso'};
let API,state={},sel=[],modo='all',dirty=0,user='desconocido',proy='proyecto',names={},wc={};
const say=(t,w)=>{$('msg').textContent=t;$('msg').className=w?'warn':''};
const key=()=>'avance:'+proy;
const ASM=o=>/ASSEMBLY/i.test(o.class||''),FAST=o=>/FASTENER/i.test(o.class||''),conLetra=s=>/[A-Za-z]/.test(s||'');
const selOf=l=>({modelObjectIds:Object.values(l.reduce((m,a)=>{(m[a.mid]=m[a.mid]||{modelId:a.mid,objectRuntimeIds:[],recursive:true}).objectRuntimeIds.push(a.rid);return m},{}))});
function pesoDe(o){for(const ps of o.properties||[])for(const q of ps.properties||[])if(/^weightnet_kg$/i.test(q.name)){const v=parseFloat(String(q.value).replace(',','.'));if(isFinite(v))return v}return 0}
async function props(mid,ids){const out=[];for(let i=0;i<ids.length;i+=500)out.push(...await API.viewer.getObjectProperties(mid,ids.slice(i,i+500)));return out}

async function init(){
  try{
    API=await TrimbleConnectWorkspace.connect(window.parent,(ev)=>{if(ev==='viewer.onSelectionChanged')readSel()},30000);
    try{proy=(await API.project.getProject()).name||proy}catch(e){}
    try{const u=await API.user.getUser();user=u.email||u.id||user}catch(e){}
    $('proy').value=proy;
    try{state=JSON.parse(localStorage.getItem(key())||'{}')}catch(e){}
    render();say('Listo. Selecciona piezas, asigna un estado y pulsa «Colorear avance».');
  }catch(e){say('No se pudo iniciar: '+e.message,1)}
}

// Selección -> ensamble (por jerarquía del visor), con GUID, marca y peso (suma de subpiezas)
async function resolver(){
  const s=await API.viewer.getSelection(),roots={};let ign=0;
  for(const o of s){
    const ids=o.objectRuntimeIds||[];if(!ids.length)continue;
    for(const p of await props(o.modelId,ids)){
      if(FAST(p)){ign++;continue}
      let rid=ASM(p)?p.id:null;
      if(rid==null){
        try{const pa=await API.viewer.getHierarchyParents(o.modelId,[p.id],4,false);
          if(pa&&pa.length){const a=(await props(o.modelId,pa.map(x=>x.id))).find(ASM);if(a)rid=a.id}}catch(e){}
      }
      if(rid==null){ign++;continue}
      roots[o.modelId+':'+rid]={mid:o.modelId,rid};
    }
  }
  const res=[];
  for(const k in roots){
    const {mid,rid}=roots[k];
    if(!wc[k]){
      const a=(await props(mid,[rid]))[0]||{};
      const g=(await API.viewer.convertToObjectIds(mid,[rid]))[0];
      let kids=[];try{kids=(await API.viewer.getHierarchyChildren(mid,[rid],4,true))||[]}catch(e){}
      const kp=await props(mid,kids.map(x=>x.id));
      const w=kp.filter(x=>!FAST(x)).reduce((t,x)=>t+pesoDe(x),0);
      wc[k]={mid,rid,guid:g,marca:(a.product&&a.product.name)||'',w:Math.round(w*10)/10,n:kids.length,modelo:names[mid]||''};
    }
    res.push(wc[k]);
  }
  return {res,ign};
}

async function readSel(){
  if(!API)return;
  try{
    if(!Object.keys(names).length)(await API.viewer.getModels()).forEach(m=>names[m.id]=m.name);
    const {res,ign}=await resolver();
    const bad=res.filter(a=>!conLetra(a.marca));
    sel=res.filter(a=>conLetra(a.marca));
    if(bad.length)try{await API.viewer.setObjectState(selOf(bad),{visible:false})}catch(e){}
    const w=sel.reduce((t,a)=>t+a.w,0);
    $('sel').textContent=sel.length?`${sel.length} ensamble(s) · ${(w/1000).toFixed(2)} t · `+sel.slice(0,12).map(a=>a.marca).join(', ')+(sel.length>12?'…':'')+(bad.length?` (${bad.length} sin marca válida, ocultos)`:''):(bad.length?'Marca sin número válido: excluida y oculta.':(ign?'La selección no pertenece a ningún ensamble (pernos u otros).':'Selecciona piezas en el modelo.'));
  }catch(e){say(e.message,1)}
}

function render(){
  const acc={montado:[0,0],proceso:[0,0]};
  for(const g in state){const e=state[g];if(acc[e.estado]){acc[e.estado][0]++;acc[e.estado][1]+=e.peso_kg||0}}
  $('res').innerHTML=['montado','proceso'].map(k=>`<tr><td><span class="dot" style="background:${HEX[k]}"></span>${NOM[k]}</td><td>${acc[k][0]}</td><td>${(acc[k][1]/1000).toFixed(1)}</td></tr>`).join('');
  $('bSave').disabled=!dirty;$('bSave').textContent=dirty?`Guardar (${dirty} cambios)`:'Guardar';
}

async function marcar(est){
  try{
    await readSel();
    if(!sel.length)return say('Selecciona primero piezas de un ensamble.',1);
    const f=new Date().toISOString();
    for(const a of sel){
      if(est==='none')delete state[a.guid];
      else state[a.guid]={marca:a.marca,modelo:a.modelo,peso_kg:a.w,estado:est,usuario:user,fecha:f};
      dirty++;
    }
    await API.viewer.setObjectState(selOf(sel),{color:est==='none'?RGB.gris:RGB[est]});
    render();say(`${sel.length} ensamble(s): ${est==='none'?'sin estado':NOM[est]}. Recuerda guardar.`);
  }catch(e){say(e.message,1)}
}

async function paint(){
  const ms=await API.viewer.getModels(),byName={};names={};
  ms.forEach(m=>{names[m.id]=m.name;byName[m.name]=m.id});
  await API.viewer.setObjectState(undefined,{color:'reset',visible:'reset'});
  if(modo==='con')await API.viewer.setObjectState(undefined,{visible:false});
  await API.viewer.setObjectState(undefined,{color:RGB.gris});
  const pm={},grp={montado:[],proceso:[]};let falta=0;
  for(const g in state){const mid=byName[state[g].modelo];if(!mid){falta++;continue}(pm[mid]=pm[mid]||[]).push(g)}
  for(const mid in pm){
    const ids=await API.viewer.convertToObjectRuntimeIds(mid,pm[mid]);
    pm[mid].forEach((g,i)=>{if(ids[i]!=null)grp[state[g].estado].push({mid,rid:ids[i]});else falta++});
  }
  for(const est in grp)if(grp[est].length){
    const st={color:RGB[est]};if(modo==='sin')st.visible=false;if(modo==='con')st.visible=true;
    await API.viewer.setObjectState(selOf(grp[est]),st);
  }
  return falta;
}
function guardar(){localStorage.setItem(key(),JSON.stringify(state));dirty=0;render();say('Guardado en el navegador (modo pruebas).')}
const snap=()=>JSON.stringify({proyecto:proy,actualizado:new Date().toISOString(),ensambles:state},null,1);

$('bCol').onclick=async()=>{try{say('Coloreando…');const f=await paint();say(f?`Coloreado. ${f} ensamble(s) guardados no están cargados en el visor.`:'Avance coloreado.')}catch(e){say(e.message,1)}};
$('bQuit').onclick=async()=>{try{await API.viewer.setObjectState(undefined,{color:'reset',visible:'reset'});say('Colores restablecidos.')}catch(e){say(e.message,1)}};
$('modo').onclick=async e=>{
  if(!e.target.dataset.m)return;modo=e.target.dataset.m;
  [...$('modo').children].forEach(b=>b.classList.toggle('on',b===e.target));
  try{await paint()}catch(x){say(x.message,1)}
};
document.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>marcar(b.dataset.e));
$('bSave').onclick=guardar;
$('bExp').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([snap()],{type:'application/json'}));a.download='avance_'+proy+'.json';a.click()};
$('bImp').onclick=()=>$('fImp').click();
$('fImp').onchange=async e=>{try{const j=JSON.parse(await e.target.files[0].text());Object.assign(state,j.ensambles||{});dirty++;render();say('JSON importado. Guarda para conservarlo.')}catch(x){say('Archivo no válido.',1)}};
$('bDiag').onclick=async()=>{
  const out=$('diag');
  try{
    await readSel();const {res,ign}=await resolver();
    let t='Ensambles detectados: '+res.length+' | ignorados: '+ign+'\n';
    for(const a of res){
      t+='\n'+a.marca+'\n GUID: '+a.guid+'\n Archivo: '+a.modelo+'\n Piezas hijas: '+a.n+'\n Peso (suma): '+a.w+' kg\n';
      const kids=await API.viewer.getHierarchyChildren(a.mid,[a.rid],4,true);
      if(kids&&kids.length){const k=(await props(a.mid,[kids[0].id]))[0]||{};
        t+=' Primera pieza: '+(k.class||'')+'\n';
        (k.properties||[]).forEach(ps=>(ps.properties||[]).forEach(q=>{t+='  '+ps.name+'.'+q.name+' = '+q.value+'\n'}));}
      break;
    }
    out.textContent=t;
  }catch(e){out.textContent='Error: '+(e.message||e)}
};
init();
</script></body></html>
