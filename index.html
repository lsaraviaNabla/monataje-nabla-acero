<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Avance de montaje</title>
<script src="https://components.connect.trimble.com/trimble-connect-workspace-api/index.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font:14px/1.4 "Segoe UI",system-ui,sans-serif;color:#1c2b3f;background:#fff}
header{background:#16345f;color:#fff;padding:12px 14px;border-bottom:3px solid #e8792b}
header h1{margin:0;font-size:18px}header small{opacity:.85;font-size:12px}
section{padding:12px 14px;border-bottom:1px solid #e3e7ec}
label{display:block;font-size:11px;letter-spacing:.04em;color:#5a6a7e;margin:8px 0 3px}
input,select{width:100%;padding:8px;border:1px solid #c6ced8;border-radius:4px;font:inherit;background:#fff}
.seg{display:flex;border:1px solid #16345f;border-radius:4px;overflow:hidden}
.seg button{flex:1;padding:7px 4px;border:0;background:#fff;color:#16345f;font:inherit;cursor:pointer}
.seg button.on{background:#16345f;color:#fff}
.row{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;padding:9px 6px;border-radius:4px;border:1px solid #16345f;background:#fff;color:#16345f;font:600 13px inherit;cursor:pointer}
.btn.pri{background:#16345f;color:#fff}.btn:disabled,.seg button:disabled{opacity:.4;cursor:default}
.btn.g{background:#2e9e4f;border-color:#2e9e4f;color:#fff}.btn.o{background:#f28c28;border-color:#f28c28;color:#fff}
h2{margin:0 0 6px;font-size:12px;letter-spacing:.04em}
table{width:100%;border-collapse:collapse}th{font-size:12px;text-align:right;color:#5a6a7e;padding:3px 0}
td{padding:5px 0;text-align:right}th:first-child,td:first-child{text-align:left}
.dot{display:inline-block;width:14px;height:14px;border-radius:3px;margin-right:7px;vertical-align:-2px}
#sel{background:#f3f6fa;border-radius:4px;padding:8px;margin:6px 0;min-height:40px;word-break:break-word}
#msg{font-size:12px;color:#5a6a7e;margin-top:8px}.warn{color:#b3361b!important}
a.lnk{color:#16345f;font-size:12px;cursor:pointer;text-decoration:underline;margin-right:12px}
</style></head><body>
<header><h1>Avance de montaje</h1><small>NABLA Acero · seguimiento por ensamble · v1.0</small></header>
<section>
 <label>MODO</label>
 <select id="modoSel"><option value="marcar">Marcado de avance</option><option value="ver">Visualización de avance</option></select>
 <label>PIEZAS A MOSTRAR</label>
 <div class="seg" id="modo"><button data-m="all" class="on">Todas</button><button data-m="con">Con estado</button><button data-m="sin">Sin estado</button></div>
 <div class="row"><button class="btn pri" id="bCol">Colorear avance</button><button class="btn" id="bQuit">Quitar colores</button></div>
 <div id="msg">Carga el modelo y presiona «Colorear avance».</div>
</section>
<section>
 <h2>ESTADO REGISTRADO</h2>
 <table><tr><th>Etapa</th><th>Ens.</th><th>Ton</th></tr><tbody id="res"></tbody></table>
 <div style="font-size:12px;color:#5a6a7e;margin-top:6px">Todo lo que no tiene estado se muestra en gris.</div>
</section>
<section>
 <h2>ENSAMBLES SELECCIONADOS</h2>
 <div id="sel">Selecciona piezas en el modelo.</div>
 <div class="row"><button class="btn g" data-e="montado">Montado</button><button class="btn" data-e="none">Quitar estado</button></div>
 <div class="row"><button class="btn pri" id="bSave" disabled>Guardar</button></div>
</section>
<section><h2>DIAGNÓSTICO</h2><div class="row" style="margin-top:0"><button class="btn" id="bDiag">Datos de la selección</button><button class="btn" id="bPerm">Probar permisos</button></div>
<pre id="diag" style="white-space:pre-wrap;font-size:11px;max-height:280px;overflow:auto;margin:8px 0 0"></pre></section>
<script>
const $=id=>document.getElementById(id);
const RGB={montado:{r:46,g:158,b:79,a:255},proceso:{r:242,g:140,b:40,a:255},gris:{r:189,g:189,b:189,a:255}};
const HEX={montado:'#2e9e4f',proceso:'#f28c28'},NOM={montado:'Montado',proceso:'En proceso'};
let API,state={},sel=[],modo='all',rol='marcar',dirty=0,user='desconocido',proy='proyecto',names={},wc={},tok=null,esperaTok=null,baseTC=null,carpetaId=null,pid=null,info=null,cargado=false,isolado=false,puedeMarcar=true,avisoRol='';
const CARPETA='5_FAB/5.5_DB_REGISTROS',ARCH='avance_actual.json';
const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
const say=(t,w)=>{$('msg').textContent=t;$('msg').className=w?'warn':''};
const key=()=>'avance:'+proy;
const ASM=o=>/ASSEMBLY/i.test(o.class||''),FAST=o=>/FASTENER/i.test(o.class||''),conLetra=s=>/[A-Za-z]/.test(s||'');
const selOf=l=>({modelObjectIds:Object.values(l.reduce((m,a)=>{const o=m[a.mid]=m[a.mid]||{modelId:a.mid,objectRuntimeIds:[]};for(const x of (a.ids||[a.rid]))o.objectRuntimeIds.push(x);return m},{}))});
function pesoDe(o){for(const ps of o.properties||[])for(const q of ps.properties||[])if(/^weightnet_kg$/i.test(q.name)){const v=parseFloat(String(q.value).replace(',','.'));if(isFinite(v))return v}return 0}
async function props(mid,ids){const out=[];for(let i=0;i<ids.length;i+=500)out.push(...await API.viewer.getObjectProperties(mid,ids.slice(i,i+500)));return out}

async function todosIds(){return ((await API.viewer.getObjects())||[]).map(m=>({modelId:m.modelId,objectRuntimeIds:(m.objects||[]).map(o=>o.id)}))}
async function mostrarTodo(){
  try{await API.viewer.setObjectState({modelObjectIds:await todosIds()},{visible:true})}catch(e){}
  await API.viewer.setObjectState(undefined,{visible:'reset'});isolado=false;
}
async function permisoEscritura(){
  await carpeta();
  const r=await fetch(baseTC+'/folders/'+carpetaId+'/permissions',{headers:{Authorization:'Bearer '+tok}});
  if(!r.ok)throw new Error('permisos '+r.status);
  const j=await r.json(),ids=new Set(),nombres=new Set();
  const add=u=>{if(!u)return;[u.id,u.tiduuid].forEach(x=>x&&ids.add(String(x)));if(u.email)ids.add(String(u.email).toLowerCase());
    const n=((u.firstName||'')+' '+(u.lastName||'')).trim().toLowerCase();if(n)nombres.add(n)};
  try{add(await API.user.getUser())}catch(e){}
  try{const x=await fetch(baseTC+'/users/me',{headers:{Authorization:'Bearer '+tok}});if(x.ok)add(await x.json())}catch(e){}
  const ok=p=>/FULL|WRITE|EDIT|ADMIN/i.test(p||'');
  return (j.permissions||[]).some(p=>p.type==='USER'&&ok(p.permission)&&(ids.has(String(p.id))||nombres.has(String(p.name||'').trim().toLowerCase())));
}
async function init(){
  try{
    API=await TrimbleConnectWorkspace.connect(window.parent,(ev,d)=>{if(ev==='viewer.onSelectionChanged')readSel();if(ev==='extension.accessToken'){const t=d&&d.data!==undefined?d.data:d;if(t&&t!=='pending'&&t!=='denied'){tok=t;if(esperaTok){esperaTok(t);esperaTok=null}}}},30000);
    try{proy=(await API.project.getProject()).name||proy}catch(e){}
    try{const u=await API.user.getUser();user=u.email||u.id||user}catch(e){}
    try{state=JSON.parse(localStorage.getItem(key())||'{}')}catch(e){}
    say('Leyendo avance guardado en Trimble Connect…');
    try{const e=await leerTC();cargado=true;if(e)state=e}catch(err){say('No se pudo leer '+CARPETA+': '+err.message+' Se usa la copia local.',1)}
    try{
      puedeMarcar=await permisoEscritura();
      if(!puedeMarcar)avisoRol='Tu usuario solo puede visualizar el avance.';
    }catch(err){
      try{
        const t=await leerTexto('editores.json');
        puedeMarcar=!!t&&(JSON.parse(t).editores||[]).map(x=>String(x).trim().toLowerCase()).includes(String(user).trim().toLowerCase());
        if(!puedeMarcar)avisoRol='Tu usuario solo puede visualizar el avance.';
      }catch(e2){puedeMarcar=false;avisoRol='No se pudo verificar tu permiso de marcado; solo visualización.'}
    }
    if(!puedeMarcar){rol='ver';$('modoSel').value='ver';$('modoSel').querySelector('option[value="marcar"]').disabled=true;try{await paint()}catch(e){}}
    render();aplicarRol();if(avisoRol)say(avisoRol,!puedeMarcar&&avisoRol.startsWith('No se pudo'));else if(!$('msg').classList.contains('warn'))say('Listo. '+Object.keys(state).length+' ensambles con estado registrado.');
  }catch(e){say('No se pudo iniciar: '+e.message,1)}
}

// ---- Trimble Connect: lectura de 5.5_DB_REGISTROS
async function token(){
  if(tok)return tok;
  const t=await API.extension.requestPermission('accesstoken');
  if(t&&t!=='pending'&&t!=='denied'){tok=t;return t}
  if(t==='denied')throw new Error('Trimble Connect no dio permiso a la extensión.');
  say('Acepta el permiso que muestra Trimble Connect…');
  return new Promise((ok,mal)=>{esperaTok=ok;setTimeout(()=>mal(new Error('Acepta el permiso de Trimble Connect e inténtalo de nuevo.')),90000)});
}
async function tc(ruta){
  const r=await fetch(baseTC+ruta,{headers:{Authorization:'Bearer '+tok}});
  if(r.status===401){tok=null;throw new Error('La sesión de Trimble venció; inténtalo de nuevo.')}
  if(!r.ok)throw new Error('Trimble respondió '+r.status+' en '+ruta);
  return r.json();
}
async function carpeta(){
  if(carpetaId)return carpetaId;
  const t=await token();pid=pid||(await API.project.getProject()).id;
  if(!baseTC)for(const b of ['https://app.connect.trimble.com','https://app21.connect.trimble.com','https://app22.connect.trimble.com','https://app31.connect.trimble.com','https://app32.connect.trimble.com']){
    try{const r=await fetch(b+'/tc/api/2.0/projects/'+pid,{headers:{Authorization:'Bearer '+t}});if(r.ok){info=await r.json();baseTC=b+'/tc/api/2.0';break}}catch(e){}
  }
  if(!baseTC)throw new Error('No pude abrir el proyecto con la API de Trimble Connect.');
  let cur=info.rootId;
  for(const p of CARPETA.split('/')){
    const f=((await tc('/folders/'+cur+'/items'))||[]).find(x=>String(x.type).toUpperCase()==='FOLDER'&&norm(x.name)===norm(p));
    if(!f)throw new Error('No encontré la carpeta «'+p+'».');
    cur=f.id;
  }
  return carpetaId=cur;
}
async function leerTexto(nombre){
  await carpeta();
  const a=((await tc('/folders/'+carpetaId+'/items'))||[]).find(x=>String(x.type).toUpperCase()==='FILE'&&norm(x.name)===norm(nombre));
  if(!a)return null;
  const du=await tc('/files/fs/'+a.id+'/downloadurl'),r=await fetch(du.url||du.downloadUrl||du);
  if(!r.ok)throw new Error('No se pudo descargar '+a.name+' ('+r.status+').');
  return r.text();
}
async function leerTC(){const t=await leerTexto(ARCH);return t?(JSON.parse(t).ensambles||{}):null}
async function tcPost(ruta,body){
  const r=await fetch(baseTC+ruta,{method:'POST',headers:{Authorization:'Bearer '+tok,'Content-Type':'application/json'},body:JSON.stringify(body||{})});
  return {s:r.status,t:await r.text()};
}
// Subida: iniciar -> enviar contenido -> confirmar -> verificar leyendo de vuelta
async function escribirTC(nombre,texto,log){
  await carpeta();
  const L=m=>{if(log)log.push(m)};
  const ini=await tcPost('/files/fs/initiate?parentId='+carpetaId+'&parentType=FOLDER',{parentId:carpetaId,parentType:'FOLDER',name:nombre});
  L('1. initiate -> '+ini.s);
  if(ini.s===401)tok=null;
  if(ini.s<200||ini.s>=300)throw new Error(ini.s===403?'tu usuario no tiene permiso de escritura en '+CARPETA:'initiate '+ini.s+' '+ini.t.slice(0,200));
  const j=JSON.parse(ini.t);
  const put=await fetch(j.uploadURL,{method:'PUT',body:new Blob([texto])});
  L('2. envío del contenido -> '+put.status);
  if(!put.ok)throw new Error('no se pudo enviar el contenido ('+put.status+')');
  const c=await tcPost('/files/fs/commit',{uploadId:j.uploadId});L('3. commit -> '+c.s);
  if(c.s<200||c.s>=300)throw new Error('commit '+c.s+' '+c.t.slice(0,160));
  for(let k=0;k<4;k++){
    await new Promise(r=>setTimeout(r,1500));
    try{const t=await leerTexto(nombre);if(t===texto){L('4. verificado: el archivo en la carpeta es idéntico');return true}}catch(e){}
  }
  L('4. no se pudo verificar el archivo en la carpeta');
  throw new Error('la subida no se pudo verificar');
}

// Selección -> ensamble (por jerarquía del visor), con GUID, marca y peso (suma de subpiezas)
async function resolver(){
  const s=await API.viewer.getSelection(),roots={};let ign=0;
  for(const o of s){
    const ids=o.objectRuntimeIds||[];if(!ids.length)continue;
    for(const p of await props(o.modelId,ids)){
      if(FAST(p)){ign++;continue}
      let rid=ASM(p)?p.id:null;
      if(rid==null){
        try{const pa=await API.viewer.getHierarchyParents(o.modelId,[p.id],4,false);
          if(pa&&pa.length){const a=(await props(o.modelId,pa.map(x=>x.id))).find(ASM);if(a)rid=a.id}}catch(e){}
      }
      if(rid==null){ign++;continue}
      roots[o.modelId+':'+rid]={mid:o.modelId,rid};
    }
  }
  const res=[];
  for(const k in roots){
    const {mid,rid}=roots[k];
    if(!wc[k]){
      const a=(await props(mid,[rid]))[0]||{};
      const g=(await API.viewer.convertToObjectIds(mid,[rid]))[0];
      let kids=[];try{kids=(await API.viewer.getHierarchyChildren(mid,[rid],4,true))||[]}catch(e){}
      const kp=await props(mid,kids.map(x=>x.id));
      const w=kp.filter(x=>!FAST(x)).reduce((t,x)=>t+pesoDe(x),0);
      wc[k]={mid,rid,guid:g,marca:(a.product&&a.product.name)||'',w:Math.round(w*10)/10,n:kids.length,modelo:names[mid]||'',ids:[rid,...kids.map(x=>x.id)]};
    }
    res.push(wc[k]);
  }
  return {res,ign};
}

async function readSel(){
  if(!API)return;
  try{
    if(!Object.keys(names).length)(await API.viewer.getModels()).forEach(m=>names[m.id]=m.name);
    const {res,ign}=await resolver();
    const bad=res.filter(a=>!conLetra(a.marca));
    sel=res.filter(a=>conLetra(a.marca));
    if(bad.length)try{await API.viewer.setObjectState(selOf(bad),{visible:false})}catch(e){}
    const w=sel.reduce((t,a)=>t+a.w,0);
    $('sel').textContent=sel.length?`${sel.length} ensamble(s) · ${(w/1000).toFixed(2)} t · `+sel.slice(0,12).map(a=>a.marca+(state[a.guid]?' ✓':'')).join(', ')+(sel.length>12?'…':'')+(sel.some(a=>state[a.guid])?' (✓ = ya montado)':'')+(bad.length?` (${bad.length} sin marca válida, ocultos)`:''):(bad.length?'Marca sin número válido: excluida y oculta.':(ign?'La selección no pertenece a ningún ensamble (pernos u otros).':'Selecciona piezas en el modelo.'));
  }catch(e){say(e.message,1)}
}

function render(){
  const acc={montado:[0,0]};
  for(const g in state){const e=state[g];if(acc[e.estado]){acc[e.estado][0]++;acc[e.estado][1]+=e.peso_kg||0}}
  $('res').innerHTML=['montado'].map(k=>`<tr><td><span class="dot" style="background:${HEX[k]}"></span>${NOM[k]}</td><td>${acc[k][0]}</td><td>${(acc[k][1]/1000).toFixed(1)}</td></tr>`).join('');
  $('bSave').disabled=!dirty||rol!=='marcar';$('bSave').textContent=dirty?`Guardar (${dirty} cambios)`:'Guardar';
}

async function marcar(est){
  if(rol!=='marcar'||!puedeMarcar)return;
  try{
    await readSel();
    if(!sel.length)return say('Selecciona primero piezas de un ensamble.',1);
    const f=new Date().toISOString(),ya=[];
    for(const a of sel){
      if(est==='none'){if(state[a.guid]){delete state[a.guid];dirty++}}
      else if(state[a.guid]&&state[a.guid].estado==='montado')ya.push(a);
      else{state[a.guid]={guid:a.guid,marca:a.marca,modelo:a.modelo,peso_kg:a.w,piezas:a.n,estado:'montado',usuario:user,fecha:f};dirty++}
    }
    await API.viewer.setObjectState(selOf(sel),{color:est==='none'?RGB.gris:RGB.montado});
    render();readSel();
    const nuevos=sel.length-ya.length;
    if(est==='none')say(`${sel.length} ensamble(s) sin estado. Recuerda guardar.`);
    else if(ya.length){const e=state[ya[0].guid];say(`Ya estaba marcado como montado: ${ya.slice(0,6).map(x=>x.marca).join(', ')}${ya.length>6?'…':''} (${(e.fecha||'').slice(0,10)}, ${e.usuario}).`+(nuevos?` Se marcaron ${nuevos} nuevo(s).`:''),1)}
    else say(`${nuevos} ensamble(s) marcados como montado. Recuerda guardar.`);
  }catch(e){say(e.message,1)}
}
async function paint(){
  const ms=await API.viewer.getModels(),byName={};names={};
  ms.forEach(m=>{names[m.id]=m.name;byName[m.name]=m.id});
  if(isolado)await mostrarTodo();
  await API.viewer.setObjectState(undefined,{color:'reset',visible:'reset'});
  await API.viewer.setObjectState(undefined,{color:RGB.gris});
  const pm={},grp={montado:[]},known={};let falta=0;
  Object.values(wc).forEach(a=>known[a.guid]=a);
  for(const g in state){
    const e=state[g];if(!grp[e.estado])continue;
    if(known[g]){grp[e.estado].push(known[g]);continue}
    const mid=byName[e.modelo];if(!mid){falta++;continue}(pm[mid]=pm[mid]||[]).push(g);
  }
  for(const mid in pm){
    let ids=await API.viewer.convertToObjectRuntimeIds(mid,pm[mid]);
    ids=(ids||[]).map(x=>Array.isArray(x)?x[0]:(x&&typeof x==='object'?(x.id??x.runtimeId):x));
    for(let i=0;i<pm[mid].length;i++){
      const g=pm[mid][i],r=ids[i];
      if(Number.isInteger(r)&&r>=0){let k=[];try{k=((await API.viewer.getHierarchyChildren(mid,[r],4,true))||[]).map(x=>x.id)}catch(e){}grp[state[g].estado].push({mid,rid:r,ids:[r,...k]})}
      else falta++;
    }
  }
  for(const est in grp)if(grp[est].length){
    const st={color:RGB[est]};if(modo==='sin')st.visible=false;
    await API.viewer.setObjectState(selOf(grp[est]),st);
  }
  if(modo==='con'){
    if(!grp.montado.length)await API.viewer.setObjectState(undefined,{visible:false});
    else{
      const sl=selOf(grp.montado).modelObjectIds;let ok=false;
      try{ok=await API.viewer.isolateEntities(sl.map(g=>({modelId:g.modelId,entityIds:g.objectRuntimeIds})))}catch(e){ok=false}
      if(ok===false){
        const ver={};sl.forEach(g=>g.objectRuntimeIds.forEach(id=>ver[g.modelId+':'+id]=1));
        const ocultar=(await todosIds()).map(g=>({modelId:g.modelId,objectRuntimeIds:g.objectRuntimeIds.filter(id=>!ver[g.modelId+':'+id])})).filter(g=>g.objectRuntimeIds.length);
        if(ocultar.length)await API.viewer.setObjectState({modelObjectIds:ocultar},{visible:false});
      }
    }
    isolado=true;
  }
  return falta;
}
function aplicarRol(){
  const m=rol==='marcar';
  render();
  document.querySelectorAll('[data-e]').forEach(b=>b.disabled=!m);
  document.querySelectorAll('#modo button,#bCol,#bQuit').forEach(b=>b.disabled=m);
}
async function guardar(){
  if(!puedeMarcar)return say('Tu usuario no tiene habilitado el marcado de avance.',1);
  if(!cargado)return say('No se pudo leer el avance de Trimble; no se guarda para no sobrescribirlo. Recarga e inténtalo de nuevo.',1);
  localStorage.setItem(key(),JSON.stringify(state));
  try{say('Guardando en Trimble Connect…');await escribirTC(ARCH,snap());dirty=0;render();say('Guardado en Trimble Connect ('+CARPETA+').')}
  catch(e){render();say('Se guardó en este equipo, pero no en Trimble: '+e.message,1)}
}
const snap=()=>JSON.stringify({proyecto:proy,num_proyecto:(String(proy).match(/^\s*(\d{3,5})/)||[])[1]||'',actualizado:new Date().toISOString(),actualizado_por:user,total_ensambles:Object.keys(state).length,total_peso_kg:Math.round(Object.values(state).reduce((t,e)=>t+(e.peso_kg||0),0)*10)/10,ensambles:state},null,1);

$('modoSel').onchange=async()=>{
  rol=$('modoSel').value;
  if(rol==='marcar'){modo='all';[...$('modo').children].forEach(b=>b.classList.toggle('on',b.dataset.m==='all'))}
  aplicarRol();
  try{say('Aplicando colores…');const f=await paint();say(f?`${f} ensamble(s) guardados no se encontraron en el visor.`:(rol==='marcar'?'Modo marcado: selecciona piezas y asigna estado.':'Modo visualización: solo lectura.'))}catch(e){say(e.message,1)}
};
$('bCol').onclick=async()=>{try{say('Coloreando…');if(!dirty){try{const e=await leerTC();if(e){state=e;render()}}catch(x){}}const f=await paint();say(f?`Coloreado. ${f} ensamble(s) guardados no están cargados en el visor.`:'Avance coloreado.')}catch(e){say(e.message,1)}};
$('bQuit').onclick=async()=>{try{if(isolado)await mostrarTodo();await API.viewer.setObjectState(undefined,{color:'reset',visible:'reset'});say('Colores restablecidos.')}catch(e){say(e.message,1)}};
$('modo').onclick=async e=>{
  if(!e.target.dataset.m)return;modo=e.target.dataset.m;
  [...$('modo').children].forEach(b=>b.classList.toggle('on',b===e.target));
  try{await paint()}catch(x){say(x.message,1)}
};

$('bPerm').onclick=async()=>{
  const out=$('diag');out.textContent='Consultando permisos…';
  try{
    await carpeta();let t='Usuario: '+user+'\nCarpeta: '+CARPETA+' ('+carpetaId+')\n';

$('bDiag').onclick=async()=>{
  const out=$('diag');
  try{
    await readSel();const {res,ign}=await resolver();
    let t='Ensambles detectados: '+res.length+' | ignorados: '+ign+'\n';

      t+='\n'+a.marca+'\n GUID: '+a.guid+'\n Archivo: '+a.modelo+'\n Piezas hijas: '+a.n+'\n Peso (suma): '+a.w+' kg\n';
      const kids=await API.viewer.getHierarchyChildren(a.mid,[a.rid],4,true);
      if(kids&&kids.length){const k=(await props(a.mid,[kids[0].id]))[0]||{};
        t+=' Primera pieza: '+(k.class||'')+'\n';
        (k.properties||[]).forEach(ps=>(ps.properties||[]).forEach(q=>{t+='  '+ps.name+'.'+q.name+' = '+q.value+'\n'}));}
      break;
    }
    const e0=Object.entries(state)[0];
    if(e0){const ms=await API.viewer.getModels(),m=ms.find(x=>x.name===e0[1].modelo);
      if(m)t+='\nPrueba GUID->ID de '+e0[1].marca+': '+JSON.stringify(await API.viewer.convertToObjectRuntimeIds(m.id,[e0[0]]))}

  }catch(e){out.textContent='Error: '+(e.message||e)}
};
